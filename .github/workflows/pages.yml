name: Publish Budget Tracker

on:
  push:
    branches: [main]
    paths:
      - "budget_tracker/web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload the app
        uses: actions/upload-pages-artifact@v3
        with:
          path: budget_tracker/web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
